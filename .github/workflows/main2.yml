name: macOS-VNC

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core VNC and Force Standard Compatibility
        run: |
          # Mengaktifkan Screen Sharing / Remote Management
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # Mengatur password VNC standar global agar kompatibel dengan VNC Viewer HP
          # Password diset ke: DenzzNO@123
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvncmode -vncmode on -setvncpw -vncpw "DenzzNO@123" \
            -restart -agent -privs -all
            
          # Membuka port 5900 di firewall macOS
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --add /System/Library/CoreServices/RemoteManagement/ScreensharingAgent.bundle/Contents/MacOS/ScreensharingAgent
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

      - name: Create VNC User with Secure Password
        run: |
          USERNAME="denzznovuser"
          PASSWORD="DenzzNO@123"
          UNIQUE_ID="2501"
          
          sudo dscl . -delete /Users/$USERNAME 2>/dev/null || true
          
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/zsh
          sudo dscl . -create /Users/$USERNAME RealName "DenzzNOV Remote User"
          sudo dscl . -create /Users/$USERNAME UniqueID $UNIQUE_ID
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          sudo createhomedir -c -u $USERNAME

      - name: Install Tailscale
        run: |
          brew install tailscale
          sudo brew services start tailscale

      - name: Establish Tailscale Connection
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              if [ -z "$TS_IP" ]; then
                  sleep 5
                  RETRIES=$((RETRIES+1))
              fi
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Gagal mendapatkan IP Tailscale."
              exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
      
      - name: Verify VNC Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          nc -zv localhost 5900

      - name: Maintain Connection
        run: |
          echo -e "\n=== DETAIL LOGIN VNC TERBARU ==="
          echo "Address  : $TAILSCALE_IP:5900"
          echo "Password VNC Langsung : DenzzNO@123"
          echo "================================\n"
          
          while true; do
              echo "[$(date)] VNC Server Active"
              sleep 300
          done
