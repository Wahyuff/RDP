name: RDP
# rdp by yamzz modifed
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 43000

    steps:
      - name: Configure Core RDP Settings By Yamzz
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $username = "DenzzNOV"
          $password = "DenzzNO@123"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name $username)) {
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://tailscale.com"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=abdulhalim
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install MS Word and PowerPoint (Office 365)
        run: |
          $officeDir = "C:\OfficeSetup"
          New-Item -ItemType Directory -Force -Path $officeDir
          Set-Location $officeDir

          $odtUrl = "https://microsoft.com"
          Invoke-WebRequest -Uri $odtUrl -OutFile "odt.exe"
          
          # Ekstraksi manual menggunakan parameter bawaan executable demi keamanan lingkungan non-interaktif
          & .\odt.exe /Q /X:"$officeDir"

          $configXml = @"
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="O365ProPlusRetail">
                <Language ID="en-us" />
                <ExcludeApp ID="Access" />
                <ExcludeApp ID="Excel" />
                <ExcludeApp ID="Lync" />
                <ExcludeApp ID="OneDrive" />
                <ExcludeApp ID="OneNote" />
                <ExcludeApp ID="Outlook" />
                <ExcludeApp ID="Publisher" />
                <ExcludeApp ID="Teams" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
          </Configuration>
          "@
          Out-File -FilePath ".\config.xml" -InputObject $configXml -Encoding utf8

          Start-Process ".\setup.exe" -ArgumentList "/configure", ".\config.xml" -Wait

      - name: First Run MS Word and PowerPoint
        run: |
          $wordPath = "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE"
          if (Test-Path $wordPath) {
              $wordProc = Start-Process $wordPath -PassThru
              Start-Sleep -Seconds 15
              Stop-Process -Id $wordProc.Id -Force
          }

          $pptPath = "C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE"
          if (Test-Path $pptPath) {
              $pptProc = Start-Process $pptPath -PassThru
              Start-Sleep -Seconds 15
              Stop-Process -Id $pptProc.Id -Force
          }
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: abdulhalim"
          Write-Host "Username: DenzzNOV"
          Write-Host "Password: DenzzNO@123"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
