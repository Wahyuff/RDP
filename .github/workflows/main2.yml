name: RDP
# rdp by yamzz modifed + Auto Login Office, Java Tools & Auto Delete Workflow History
on:
  workflow_dispatch:

# Memberikan izin kepada token GitHub untuk menghapus riwayat run
permissions:
  actions: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # Batas maksimal durasi runner GitHub Actions (6 jam)

    steps:
      - name: Configure Core RDP Settings By Yamzz
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $username = "DenzzNOV"
          $password = "DenzzNO@123"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          "RDP_CREDS=User: $username | Password: $password" | Add-Content -Path $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name $username)) {
              exit 1
          }

      - name: Auto Install VS Code, JDK, Microsoft 365, and Tailscale
        run: |
          Write-Host "Menginstal VS Code..."
          choco install vscode -y --no-progress
          
          Write-Host "Menginstal Microsoft 365 (Office 365 ProPlus Apps)..."
          choco install office365proplus -y --no-progress

          Write-Host "Menginstal Java JDK..."
          choco install openjdk -y --no-progress

          Write-Host "Menginstal Tailscale secara aman via Chocolatey..."
          choco install tailscale -y --no-progress

      - name: Auto Configure VS Code Extensions globally
        run: |
          $env:Path += ";$env:ProgramFiles\Microsoft VS Code\bin"
          
          # Membuat folder profile user baru secara paksa agar direktori AppData terbentuk
          $userDir = "C:\Users\DenzzNOV"
          if (-not (Test-Path $userDir)) { New-Item -ItemType Directory -Path $userDir -Force }
          
          $extensionsDir = "C:\Users\DenzzNOV\.vscode\extensions"
          $userDataDir = "C:\Users\DenzzNOV\AppData\Roaming\Code"
          
          Write-Host "Menginstal Extension Pack for Java..."
          code --install-extension vscjava.vscode-java-pack --extensions-dir=$extensionsDir --user-data-dir=$userDataDir

          Write-Host "Menginstal Auto Rename Tag..."
          code --install-extension formulahendry.auto-rename-tag --extensions-dir=$extensionsDir --user-data-dir=$userDataDir

          Write-Host "Menginstal Prettier - Code formatter..."
          code --install-extension esbenp.prettier-vscode --extensions-dir=$extensionsDir --user-data-dir=$userDataDir

      - name: Auto Inject Microsoft Word Credentials to Specific User
        run: |
          $msEmail = "${{ secrets.MICROSOFT_EMAIL }}"
          $msPassword = "${{ secrets.MICROSOFT_PASSWORD }}"
          
          if (-not $msEmail -or -not $msPassword) {
              Write-Warning "Kredensial Microsoft tidak diset di GitHub Secrets! Melewati login otomatis."
          } else {
              Write-Host "Menyuntikkan lisensi Microsoft Office ke mesin..."
              $registryPath = "HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration"
              if (Test-Path $registryPath) {
                  Set-ItemProperty -Path $registryPath -Name "SharedComputerLicensing" -Value 1 -Force
              }

              # Trik Windows: Me-mount Registry milik user DenzzNOV secara paksa agar modifikasi masuk ke akunnya
              Write-Host "Memuat registry user DenzzNOV..."
              $userHivePath = "C:\Users\DenzzNOV\NTUSER.DAT"
              
              # Membuat simulasi login singkat agar file NTUSER.DAT terbuat jika belum ada
              if (-not (Test-Path $userHivePath)) {
                  Write-Host "Memicu pembuatan profile Windows untuk DenzzNOV..."
                  $secpasswd = ConvertTo-SecureString "DenzzNO@123" -AsPlainText -Force
                  $creds = New-Object System.Management.Automation.PSCredential ("DenzzNOV", $secpasswd)
                  Start-Job -ScriptBlock { param($c) Start-Process cmd -Credential $c } -ArgumentList $creds | Wait-Job -Timeout 5
              }

              if (Test-Path $userHivePath) {
                  reg load HKU\DenzzNOV $userHivePath
                  
                  $targetReg = "HKU:\DenzzNOV\Software\Microsoft\Office\16.0\Common\Identity"
                  if (-not (Test-Path $targetReg)) { New-Item -Path $targetReg -Force | Out-Null }
                  Set-ItemProperty -Path $targetReg -Name "DefaultUserType" -Value 1 -Force
                  Set-ItemProperty -Path $targetReg -Name "FederatedUser" -Value 0 -Force
                  
                  reg unload HKU\DenzzNOV
              }

              # Menyimpan kredensial ke Windows Vault (Akan terbaca secara global/lokal saat Office dibuka)
              cmdkey /generic:MicrosoftOffice16:user=$msEmail /user:$msEmail /pass:$msPassword
          }

      - name: Establish Tailscale Connection
        run: |
          $env:Path += ";C:\Program Files\Tailscale"
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          
          if (-not (Test-Path $tsExe)) {
              Write-Error "Aplikasi Tailscale gagal terpasang!"
              exit 1
          }
          
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=abdulhalim --reset
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Gagal mendapatkan IP Tailscale!"
              exit 1
          }
          "TAILSCALE_IP=$tsIP" | Add-Content -Path $env:GITHUB_ENV

      - name: Keep RDP Alive & Auto Delete Workflow History
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "RDP aktif! Menghapus riwayat run ini dari log GitHub untuk privasi..."
          gh api -X DELETE "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --silent
          
          Write-Host "Menjaga koneksi tetap hidup selama maksimal 6 jam..."
          for ($i = 0; $i -lt 215; $i++) {
              Start-Sleep -Seconds 100
          }
