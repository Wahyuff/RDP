name: RDP
# rdp by yamzz modifed + Auto Login Office, Java Tools & Auto Delete Workflow History
on:
  workflow_dispatch:

# Memberikan izin kepada token GitHub untuk menghapus riwayat run
permissions:
  actions: write

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 43000

    steps:
      - name: Configure Core RDP Settings By Yamzz
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $username = "DenzzNOV"
          $password = "DenzzNO@123"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name $username)) {
              exit 1
          }

      - name: Auto Install VS Code, JDK, Microsoft 365, and Tailscale
        run: |
          Write-Host "Menginstal VS Code..."
          choco install vscode -y --no-progress
          
          Write-Host "Menginstal Microsoft 365 (Office 365 ProPlus Apps)..."
          choco install office365proplus -y --no-progress

          Write-Host "Menginstal Java JDK..."
          choco install openjdk -y --no-progress

          Write-Host "Menginstal Tailscale secara aman via Chocolatey..."
          choco install tailscale -y --no-progress

      - name: Auto Configure VS Code Extensions
        run: |
          $env:Path += ";$env:ProgramFiles\Microsoft VS Code\bin"
          $userProfileDir = "C:\Users\DenzzNOV\AppData\Roaming\Code"
          
          Write-Host "Menginstal Extension Pack for Java..."
          code --install-extension vscjava.vscode-java-pack --user-data-dir=$userProfileDir

          Write-Host "Menginstal Auto Rename Tag..."
          code --install-extension formulahendry.auto-rename-tag --user-data-dir=$userProfileDir

          Write-Host "Menginstal Prettier - Code formatter..."
          code --install-extension esbenp.prettier-vscode --user-data-dir=$userProfileDir

      - name: Auto Inject Microsoft Word Credentials
        run: |
          $msEmail = "${{ secrets.MICROSOFT_EMAIL }}"
          $msPassword = "${{ secrets.MICROSOFT_PASSWORD }}"
          
          if (-not $msEmail -or -not $msPassword) {
              Write-Warning "Kredensial Microsoft tidak diset di GitHub Secrets! Melewati login otomatis."
          } else {
              Write-Host "Menyuntikkan lisensi & identitas login Microsoft Word..."
              
              $registryPath = "HKLM:\SOFTWARE\Microsoft\Office\ClickToRun\Configuration"
              if (Test-Path $registryPath) {
                  Set-ItemProperty -Path $registryPath -Name "SharedComputerLicensing" -Value 1 -Force
              }

              $userRegIdentity = "HKU:\.DEFAULT\Software\Microsoft\Office\16.0\Common\Identity"
              if (-not (Get-LocalUser -Name $username)) {
                  exit 1
              }
              if (-not (Test-Path $userRegIdentity)) { New-Item -Path $userRegIdentity -Force | Out-Null }
              Set-ItemProperty -Path $userRegIdentity -Name "DefaultUserType" -Value 1 -Force
              Set-ItemProperty -Path $userRegIdentity -Name "FederatedUser" -Value 0 -Force
              
              cmdkey /generic:MicrosoftOffice16:user=$msEmail /user:$msEmail /pass:$msPassword
          }

      - name: Establish Tailscale Connection
        run: |
          $env:Path += ";C:\Program Files\Tailscale"
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          
          if (-not (Test-Path $tsExe)) {
              Write-Error "Aplikasi Tailscale gagal terpasang!"
              exit 1
          }
          
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=abdulhalim --reset
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: abdulhalim"
          Write-Host "Username: DenzzNOV"
          Write-Host "Password: DenzzNO@123"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }

      # Langkah baru: Otomatis menghapus riwayat run begitu sesi selesai/mati
      - name: Auto Clean Workflow History
        if: always()
        run: |
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $repo = "${{ github.repository }}"
          $runId = "${{ github.run_id }}"
          
          Write-Host "Menghapus riwayat run ID: $runId dari repositori..."
          
          $headers = @{
              "Authorization" = "Bearer $token"
              "Accept"        = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }
          
          $url = "https://github.com"
          Invoke-RestMethod -Method Delete -Uri $url -Headers $headers
          Write-Host "Riwayat berhasil dihapus secara otomatis!"
