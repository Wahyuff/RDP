name: RDP
# rdp by yamzz modifed
on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 43000

    steps:
      - name: Configure Core RDP Settings By Yamzz
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          $username = "DenzzNOV"
          $password = "DenzzNO@123"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV
          
          if (-not (Get-LocalUser -Name $username)) {
              exit 1
          }

      - name: Install Tailscale (Stable Tar Extraction)
        run: |
          Write-Host "Mengunduh Tailscale paket Portable ZIP..."
          $tsZipUrl = "https://tailscale.com"
          $zipPath = "$env:TEMP\tailscale.zip"
          $extractPath = "$env:TEMP\ts_extracted"
          
          if (-not (Test-Path $extractPath)) {
              New-Item -ItemType Directory -Force -Path $extractPath
          }
          
          Invoke-WebRequest -Uri $tsZipUrl -OutFile $zipPath
          
          Write-Host "Mengekstrak paket Tailscale menggunakan tar.exe..."
          # Perbaikan Utama: Menggunakan tar bawaan Windows untuk menghindari eror Expand-Archive
          tar.exe -xf $zipPath -C $extractPath
          
          # Membuat folder tujuan permanen di Program Files
          $targetDir = "$env:ProgramFiles\Tailscale"
          if (-not (Test-Path $targetDir)) {
              New-Item -ItemType Directory -Force -Path $targetDir
          }
          
          # Menyalin file exe hasil ekstraksi ke folder tujuan
          $exeFiles = Get-ChildItem -Path $extractPath -Filter "*.exe" -Recurse
          foreach ($file in $exeFiles) {
              Copy-Item -Path $file.FullName -Destination $targetDir -Force
          }
          
          $tsExePath = "$targetDir\tailscale.exe"
          $tsDExePath = "$targetDir\tailscaled.exe"
          
          if (-not (Test-Path $tsExePath)) {
              Write-Error "Gagal menemukan tailscale.exe setelah ekstraksi!"
              exit 1
          }
          
          Write-Host "Mendaftarkan dan menjalankan Tailscale Service..."
          sc.exe create tailscaled binPath= "`"$tsDExePath`" --cleanup" start= auto
          sc.exe start tailscaled
          
          # Beri jeda agar Windows Service selesai inisialisasi awal
          Start-Sleep -Seconds 5
          
          # Pembersihan file sampah
          Remove-Item $zipPath -Force
          Remove-Item $extractPath -Recurse -Force
          Write-Host "Tailscale Berhasil Terpasang!"

      - name: Establish Tailscale Connection
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=abdulhalim
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Gagal mendapatkan IP Tailscale!"
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install MS Word and PowerPoint (Office 365)
        run: |
          Write-Host "Membuat direktori kerja Office..."
          $officeDir = "C:\OfficeSetup"
          if (-not (Test-Path $officeDir)) {
              New-Item -ItemType Directory -Force -Path $officeDir
          }
          Set-Location $officeDir

          Write-Host "Mengunduh Office Deployment Tool..."
          $odtUrl = "https://microsoft.com"
          Invoke-WebRequest -Uri $odtUrl -OutFile "odt.exe"
          
          if ((Get-Item "odt.exe").Length -lt 1MB) {
              Write-Error "Gagal mengunduh odt.exe (File rusak/terpotong)"
              exit 1
          }

          Write-Host "Mengekstrak ODT..."
          $extractArgs = "/extract:`"$officeDir`" /quiet /log:`"$officeDir\extract.log`""
          $process = Start-Process -FilePath ".\odt.exe" -ArgumentList $extractArgs -Wait -PassThru
          
          if (-not (Test-Path ".\setup.exe")) {
              Write-Host "Metode ekstraksi pertama gagal, mencoba metode alternatif..."
              Start-Sleep -Seconds 3
              & .\odt.exe /Q /X:"$officeDir"
          }

          if (-not (Test-Path ".\setup.exe")) {
              Write-Error "Ekstraksi gagal! setup.exe tidak ditemukan di $officeDir."
              if (Test-Path ".\extract.log") { Get-Content ".\extract.log" }
              exit 1
          }

          Write-Host "Membuat file konfigurasi khusus Word & PPT..."
          $configXml = @"
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="O365ProPlusRetail">
                <Language ID="en-us" />
                <ExcludeApp ID="Access" />
                <ExcludeApp ID="Excel" />
                <ExcludeApp ID="Lync" />
                <ExcludeApp ID="OneDrive" />
                <ExcludeApp ID="OneNote" />
                <ExcludeApp ID="Outlook" />
                <ExcludeApp ID="Publisher" />
                <ExcludeApp ID="Teams" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
          </Configuration>
          "@
          Out-File -FilePath ".\config.xml" -InputObject $configXml -Encoding utf8

          Write-Host "Memulai proses instalasi Office (Mohon tunggu beberapa menit)..."
          $installProcess = Start-Process ".\setup.exe" -ArgumentList "/configure", ".\config.xml" -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
              Write-Error "Instalasi Office gagal dengan Exit Code: $($installProcess.ExitCode)"
              exit 1
          }
          Write-Host "Instalasi selesai dengan sukses!"

      - name: First Run MS Word and PowerPoint
        run: |
          Write-Host "Menjalankan Word untuk pertama kali..."
          $wordPath = "C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE"
          if (Test-Path $wordPath) {
              $wordProc = Start-Process $wordPath -PassThru
              Start-Sleep -Seconds 15
              Stop-Process -Id $wordProc.Id -Force
              Write-Host "Word berhasil diinisialisasi."
          } else {
              Write-Host "WINWORD.EXE tidak ditemukan!"
          }

          Write-Host "Menjalankan PowerPoint untuk pertama kali..."
          $pptPath = "C:\Program Files\Microsoft Office\root\Office16\POWERPNT.EXE"
          if (Test-Path $pptPath) {
              $pptProc = Start-Process $pptPath -PassThru
              Start-Sleep -Seconds 15
              Stop-Process -Id $pptProc.Id -Force
              Write-Host "PowerPoint berhasil diinisialisasi."
          } else {
              Write-Host "POWERPNT.EXE tidak ditemukan!"
          }
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: abdulhalim"
          Write-Host "Username: DenzzNOV"
          Write-Host "Password: DenzzNO@123"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
