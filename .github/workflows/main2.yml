name: macOS-VNC

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360 # Batas maksimal durasi runner GitHub Actions gratis

    steps:
      - name: Configure Core VNC/Screen Sharing Settings
        run: |
          # Mengaktifkan Screen Sharing bawaan macOS
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist
          
          # Membuka port VNC (5900) pada firewall macOS
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --add /System/Library/CoreServices/RemoteManagement/ScreensharingAgent.bundle/Contents/MacOS/ScreensharingAgent
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate on

      - name: Create VNC User with Secure Password
        run: |
          # Username dan Password untuk login remote desktop
          USERNAME="DenzzNOV"
          PASSWORD="DenzzNO@123"
          
          # Membuat user baru di macOS menggunakan dscl
          sudo dscl . -create /Users/$USERNAME
          sudo dscl . -create /Users/$USERNAME UserShell /bin/zsh
          sudo dscl . -create /Users/$USERNAME RealName "DenzzNOV User"
          sudo dscl . -create /Users/$USERNAME UniqueID 501
          sudo dscl . -create /Users/$USERNAME PrimaryGroupID 20
          sudo dscl . -create /Users/$USERNAME NFSHomeDirectory /Users/$USERNAME
          sudo dscl . -passwd /Users/$USERNAME "$PASSWORD"
          
          # Memberikan hak akses Administrator (sudo) kepada user baru
          sudo dscl . -append /Groups/admin GroupMembership $USERNAME
          
          # Membuat direktori home untuk user tersebut
          sudo createhomedir -c -u $USERNAME
          
          echo "VNC_CREDS=User: $USERNAME | Password: $PASSWORD" >> $GITHUB_ENV

      - name: Install Tailscale
        run: |
          # Menginstal Tailscale menggunakan Homebrew bawaan runner macOS
          brew install tailscale
          
          # Mendaftarkan dan menjalankan background service Tailscale
          sudo brew services start tailscale

      - name: Establish Tailscale Connection
        run: |
          # Menghubungkan ke Tailscale network menggunakan Auth Key
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          # Menunggu hingga mendapatkan IP Tailscale
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              if [ -z "$TS_IP" ]; then
                  sleep 5
                  RETRIES=$((RETRIES+1))
              fi
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Gagal mendapatkan IP Tailscale."
              exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
      
      - name: Verify VNC Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          
          # Memeriksa apakah port 5900 sudah terbuka dan merespons jaringan
          nc -zv localhost 5900
          if [ $? -ne 0 ]; then
              echo "Port VNC 5900 tidak merespons!"
              exit 1
          fi
          echo "Konektivitas internal VNC sukses!"

      - name: Maintain Connection
        run: |
          echo -e "\n=== VNC ACCESS (macOS) ==="
          echo "Address: $TAILSCALE_IP"
          echo "Port: 5900"
          echo "Username: DenzzNOV"
          echo "Password: DenzzNO@123"
          echo "==========================\n"
          
          # Looping untuk menahan runner agar tidak mati otomatis
          while true; do
              echo "[$(date)] VNC Active"
              sleep 300
          done
