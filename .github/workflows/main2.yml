
name: RDP Windows with Office

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Secure RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          # Allow RDP through Windows Firewall
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -Profile Any

          Write-Host "RDP configured with NLA enabled."

      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: ${{ secrets.RDP_USERNAME }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:RDP_USERNAME -or
              -not $env:RDP_PASSWORD) {
            throw "Configure RDP_USERNAME and RDP_PASSWORD in GitHub Secrets."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePass `
              -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser `
              -Name $env:RDP_USERNAME `
              -Password $securePass
          }

          Add-LocalGroupMember `
            -Group 'Remote Desktop Users' `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Write-Host "RDP account configured."

      - name: Install Microsoft Word and PowerPoint
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $officeDir = Join-Path $env:TEMP 'OfficeDeploy'
          New-Item -ItemType Directory `
            -Path $officeDir -Force | Out-Null

          # Download the official Microsoft Office Deployment Tool
          $odtFile = Join-Path $officeDir 'odt.exe'
          Invoke-WebRequest `
            -Uri 'https://aka.ms/OfficeDeploymentTool' `
            -OutFile $odtFile

          # Extract the deployment tool
          $extract = Start-Process `
            -FilePath $odtFile `
            -ArgumentList "/quiet /extract:$officeDir" `
            -Wait -PassThru

          $setup = Join-Path $officeDir 'setup.exe'

          if (-not (Test-Path $setup)) {
            throw "Office Deployment Tool extraction failed."
          }

          # Microsoft 365 Apps: requires a compatible license
          # Install Word and PowerPoint, excluding other major apps
          $xml = @'
          <Configuration>
            <Add OfficeClientEdition="64" Channel="Current">
              <Product ID="O365ProPlusRetail">
                <Language ID="id-id" />
                <ExcludeApp ID="Access" />
                <ExcludeApp ID="Excel" />
                <ExcludeApp ID="OneNote" />
                <ExcludeApp ID="Outlook" />
                <ExcludeApp ID="Publisher" />
                <ExcludeApp ID="Teams" />
              </Product>
            </Add>
            <Display Level="None" AcceptEULA="TRUE" />
            <Updates Enabled="TRUE" />
          </Configuration>
          '@

          $config = Join-Path $officeDir 'office.xml'
          Set-Content -Path $config -Value $xml -Encoding UTF8

          $install = Start-Process `
            -FilePath $setup `
            -ArgumentList "/configure `"$config`"" `
            -Wait -PassThru

          if ($install.ExitCode -ne 0) {
            throw "Office setup returned exit code $($install.ExitCode)"
          }

          $word = "$env:ProgramFiles\Microsoft Office\root\Office16\WINWORD.EXE"
          $ppt = "$env:ProgramFiles\Microsoft Office\root\Office16\POWERPNT.EXE"

          if (-not (Test-Path $word) -or -not (Test-Path $ppt)) {
            throw "Word or PowerPoint was not found after installation."
          }

          Write-Host "Word and PowerPoint installation verified."

      - name: Configure Office First Run Experience
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Office policies to reduce first-run welcome screens.
          # These do not bypass sign-in or product activation.
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Office\16.0\Firstrun'

          New-Item -Path $policy -Force | Out-Null

          New-ItemProperty `
            -Path $policy `
            -Name 'DisableFirstRunMovie' `
            -PropertyType DWord `
            -Value 1 -Force | Out-Null

          New-ItemProperty `
            -Path $policy `
            -Name 'DisableWelcomeExperience' `
            -PropertyType DWord `
            -Value 1 -Force | Out-Null

          Write-Host "Office first-run policies configured."

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi' `
            -OutFile $installer

          $install = Start-Process `
            -FilePath 'msiexec.exe' `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          if ($install.ExitCode -ne 0) {
            throw "Tailscale installation failed."
          }

      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:TAILSCALE_AUTH_KEY) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            '--hostname=abdulhalim'

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $ip = $null

          for ($i = 0; $i -lt 12; $i++) {
            $result = & $ts ip -4
            if ($LASTEXITCODE -eq 0 -and $result) {
              $ip = ($result | Select-Object -First 1).Trim()
              if ($ip) { break }
            }
            Start-Sleep -Seconds 5
          }

          if (-not $ip) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host "Tailscale connected: $ip"

      - name: Verify RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $service = Get-Service -Name TermService

          if ($service.Status -ne 'Running') {
            Start-Service -Name TermService
          }

          $ready = $false

          for ($i = 0; $i -lt 12; $i++) {
            $test = Test-NetConnection `
              -ComputerName '127.0.0.1' `
              -Port 3389 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "RDP port 3389 is not listening."
          }

          Write-Host "RDP service is listening."

      - name: Display Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== RDP READY =========="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: Set in GitHub Secrets (RDP_USERNAME)"
          Write-Host "Password: Set in GitHub Secrets (RDP_PASSWORD)"
          Write-Host "Office: Word and PowerPoint"
          Write-Host "==============================="

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner active"
            Start-Sleep -Seconds 300
          }
