
name: RDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Indonesia Region and RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-Culture id-ID
          Set-WinSystemLocale id-ID
          Set-WinUserLanguageList id-ID -Force
          Set-TimeZone -Id "SE Asia Standard Time"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 1

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 `
            remoteip=100.64.0.0/10 profile=any

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure RDP firewall."
          }

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $username = "DenzzNOV"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "RDP_PASSWORD secret is missing."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $existingUser = Get-LocalUser `
            -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
            Set-LocalUser -Name $username -Password $securePass
          } else {
            New-LocalUser `
              -Name $username `
              -Password $securePass `
              -AccountNeverExpires | Out-Null
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "RDP user configured."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = "$env:TEMP\tailscale-setup.msi"
          $downloadUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $installerPath

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$installerPath`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed."
          }

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
            throw "Tailscale executable not found."
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=abdulhalim"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
            $candidate = & $tsExe ip -4 2>$null
            $candidate = ($candidate | Select-Object -First 1).Trim()

            if ($candidate -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
              $tsIP = $candidate
              break
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale hostname: abdulhalim"
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Listener
        shell: pwsh
        run: |
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP listener detected."
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "RDP is running."
          Write-Host "Hostname: abdulhalim"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: DenzzNOV"
          Write-Host "Password is stored in GitHub Secrets."

          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Runner active"
            Start-Sleep -Seconds 300
          }
