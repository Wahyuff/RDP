name: macOS-VNC-Fixed

on:
  workflow_dispatch:

jobs:
  secure-vnc:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Install Tailscale and TigerVNC
        run: |
          # Memperbarui Homebrew dan menginstal modul secara langsung
          brew install tailscale tigervnc
          
          # Menjalankan background service untuk Tailscale
          sudo brew services start tailscale

      - name: Configure TigerVNC Server Password
        run: |
          # Memuat path Homebrew secara dinamis agar perintah 'vncpasswd' bisa ditemukan
          if [ -f /opt/homebrew/bin/brew ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [ -f /usr/local/bin/brew ]; then
              eval "$(/usr/local/bin/brew shellenv)"
          fi
          
          # Membuat folder konfigurasi VNC di dalam direktori user utama
          mkdir -p ~/.vnc
          
          # Mengatur password akses langsung ke: DenzzNO@123
          echo "DenzzNO@123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

      - name: Launch Virtual VNC Display
        run: |
          # Memuat path Homebrew secara dinamis agar perintah 'vncserver' bisa ditemukan
          if [ -f /opt/homebrew/bin/brew ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [ -f /usr/local/bin/brew ]; then
              eval "$(/usr/local/bin/brew shellenv)"
          fi
          
          # Menghapus berkas lock sisa (jika ada) agar tidak memblokir server virtual
          rm -rf /tmp/.X11-unix/X1 2>/dev/null || true
          rm -rf /tmp/.X12-unix/X1 2>/dev/null || true
          
          # Memulai server layar virtual pada Port 5901 (Display :1)
          vncserver :1 -localhost no -geometry 1280x720 -depth 24

      - name: Establish Tailscale Connection
        run: |
          # Memuat path Homebrew secara dinamis agar perintah 'tailscale' bisa ditemukan
          if [ -f /opt/homebrew/bin/brew ]; then
              eval "$(/opt/homebrew/bin/brew shellenv)"
          elif [ -f /usr/local/bin/brew ]; then
              eval "$(/usr/local/bin/brew shellenv)"
          fi
          
          # Menyambungkan mesin macOS ke jaringan VPN Tailscale Anda
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-mac-runner-$GITHUB_RUN_ID
          
          # Menunggu interaksi jaringan hingga IP internal didapatkan
          TS_IP=""
          RETRIES=0
          while [ -z "$TS_IP" ] && [ $RETRIES -lt 10 ]; do
              TS_IP=$(tailscale ip -4)
              if [ -z "$TS_IP" ]; then
                  sleep 5
                  RETRIES=$((RETRIES+1))
              fi
          done
          
          if [ -z "$TS_IP" ]; then
              echo "Gagal memperoleh IP jaringan Tailscale!"
              exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
      
      - name: Verify VNC Port Accessibility
        run: |
          echo "Tailscale IP: $TAILSCALE_IP"
          # Mengecek kesiapan sistem pada Port 5901 (Display :1)
          nc -zv localhost 5901

      - name: Maintain Connection
        run: |
          echo -e "\n=== DETAIL LOGIN VNC TERBARU (ANTI-ERROR) ==="
          echo "Address  : $TAILSCALE_IP:5901"
          echo "Password : DenzzNO@123"
          echo "=============================================\n"
          
          # Loop penahan agar runner tidak tertutup otomatis oleh sistem GitHub Actions
          while true; do
              echo "[$(date)] VNC Server Active on Port 5901"
              sleep 300
          done
